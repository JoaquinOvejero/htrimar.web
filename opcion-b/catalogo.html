<!doctype html>
<html lang="es-AR" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | H. Trimarchi S.R.L.</title>
  <meta name="description" content="Catálogo de repuestos, componentes y equipos para ascensores: kits, cabinas, máquinas, centrales, pistones, puertas, guías, cables y controles.">
  <link rel="icon" href="https://trimarchi.com.ar/wp-content/uploads/2025/08/cropped-HT-150x150.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/b-head.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/b.css">
</head>
<body data-page="catalogo" class="bg-white font-sans text-ink-2 antialiased overflow-x-hidden">
  <div id="site-header"></div>

  <main>
    <section id="pb" data-floor="PB" data-floor-name="Catálogo" class="blueprint border-b border-steel-200 bg-steel-50">
      <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
        <div class="reveal" id="tag"></div>
        <div class="mt-4 flex flex-wrap items-end justify-between gap-6">
          <h1 class="reveal font-display text-[2.5rem] font-extrabold leading-tight text-navy-900 sm:text-6xl">Catálogo</h1>
          <p class="reveal max-w-md text-lg">Más de 9.000 productos en stock. Si no encontrás lo que buscás, <a href="contacto.html#formulario" class="font-semibold text-navy-800 underline">consultanos</a>.</p>
        </div>

        <!-- Filters -->
        <div class="reveal mt-8 rounded-2xl border border-steel-200 bg-white p-4 shadow-sm sm:p-5">
          <div class="grid gap-3 md:grid-cols-[1fr_15rem]">
            <label class="flex items-center gap-3 rounded-xl border border-steel-300 px-4 focus-within:border-navy-700">
              <i data-lucide="search" class="h-5 w-5 text-ink-3" stroke-width="1.75"></i>
              <input id="q" type="search" placeholder="Filtrar por producto, modelo o marca" class="h-12 flex-1 bg-transparent text-navy-900 outline-none placeholder:text-ink-3" aria-label="Filtrar el catálogo">
            </label>
            <select id="brand" class="h-12 rounded-xl border border-steel-300 bg-white px-4 text-navy-900 outline-none focus:border-navy-700" aria-label="Filtrar por marca">
              <option value="">Todas las marcas</option>
            </select>
          </div>
          <div id="chips" class="no-scrollbar mt-3 flex gap-2 overflow-x-auto" role="group" aria-label="Rubros"></div>
        </div>
        <p id="count" class="mt-4 font-mono text-sm text-ink-3" aria-live="polite"></p>
      </div>
    </section>

    <div id="sections"></div>
    <div id="empty" class="hidden px-4 py-20 text-center">
      <i data-lucide="search-x" class="mx-auto h-10 w-10 text-steel-300" stroke-width="1.25"></i>
      <p class="mt-4 font-display text-2xl font-bold text-navy-900">No encontramos ese producto en la web</p>
      <p class="mx-auto mt-2 max-w-md">Tenemos más de 9.000 productos en stock: escribinos y lo buscamos por vos.</p>
      <a href="contacto.html#formulario" class="mt-6 inline-flex rounded-full bg-navy-800 px-6 py-3 font-semibold text-white">Consultar</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/site.js"></script>
  <script src="assets/b-core.js"></script>
  <script>
    document.getElementById('tag').innerHTML = floorTag('PB', 'Planta baja · Catálogo');

    // One section ("floor") per category
    document.getElementById('sections').innerHTML = B_CATEGORIES.map((c, i) => `
      <section id="rubro-${c.id}" data-floor="0${i + 1}" data-floor-name="${c.name}" data-cat-section="${c.id}" class="border-b border-steel-200 py-12 sm:py-14">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex items-center gap-4">${floorTag(`0${i + 1}`, c.name)}</div>
          <div class="mt-6 grid gap-4 lg:grid-cols-2">
            ${c.slugs.map(s => productRowHTML(PRODUCTS.find(p => p.slug === s))).join('')}
          </div>
        </div>
      </section>`).join('');

    const brandSelect = document.getElementById('brand');
    brandSelect.insertAdjacentHTML('beforeend', BRANDS.filter(b => PRODUCTS.some(p => p.brand === b.id)).map(b => `<option value="${b.id}">${b.name}</option>`).join(''));

    const chips = document.getElementById('chips');
    chips.innerHTML = [{ id: '', name: 'Todos los rubros' }, ...B_CATEGORIES].map(c => `
      <button type="button" data-cat="${c.id}" class="shrink-0 rounded-full border px-4 py-2 text-sm font-medium transition">${c.name}</button>`).join('');

    const params = new URLSearchParams(location.search);
    let cat = B_CATEGORIES.some(c => c.id === params.get('rubro')) ? params.get('rubro') : '';
    const q = document.getElementById('q');
    const productText = Object.fromEntries(PRODUCTS.map(p => [p.slug, norm([p.name, p.short, p.brand && brandById(p.brand).name, ...(p.models || []).flatMap(m => [m.name, ...(m.specs || [])])].join(' '))]));

    const apply = () => {
      const terms = norm(q.value).trim().split(/\s+/).filter(Boolean);
      let visible = 0;
      document.querySelectorAll('[data-product]').forEach(card => {
        const ok = (!cat || card.dataset.category === cat)
          && (!brandSelect.value || card.dataset.brand === brandSelect.value)
          && terms.every(t => productText[card.dataset.product].includes(t));
        card.classList.toggle('hidden', !ok);
        if (ok) visible += 1;
      });
      document.querySelectorAll('[data-cat-section]').forEach(sec => sec.classList.toggle('hidden', !sec.querySelector('[data-product]:not(.hidden)')));
      chips.querySelectorAll('[data-cat]').forEach(b => {
        const on = b.dataset.cat === cat;
        b.className = `shrink-0 rounded-full border px-4 py-2 text-sm font-medium transition ${on ? 'border-navy-800 bg-navy-800 text-white' : 'border-steel-300 text-ink-2 hover:border-navy-700'}`;
        b.setAttribute('aria-pressed', on);
      });
      document.getElementById('count').textContent = `${visible} ${visible === 1 ? 'línea de productos' : 'líneas de productos'}`;
      document.getElementById('empty').classList.toggle('hidden', visible > 0);
    };
    chips.addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; apply(); } });
    q.addEventListener('input', apply);
    brandSelect.addEventListener('change', apply);
    apply();
  </script>
  <script src="assets/b-layout.js"></script>
</body>
</html>
